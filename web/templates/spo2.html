{% extends "patient_base.html" %}
{% block title %}SpO2{% endblock %}
{% block content %}
<div class="page page-sm">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
        <a href="javascript:history.back()" style="color:var(--text); text-decoration:none; font-size:24px;">←</a>
        <h3 style="font-weight:700;">SpO2 Level</h3>
    </div>
    <p style="color:var(--muted); font-size:12px; margin-bottom:16px;">Step 5 of 7</p>
    <div style="height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:32px;">
        <div style="height:100%; width:71%; background:var(--blue); border-radius:4px;"></div>
    </div>

    <h2 style="font-size:20px; font-weight:700; margin-bottom:8px;">Oxygen Saturation</h2>
    <p style="color:var(--text2); font-size:14px; margin-bottom:24px;">Enter your oxygen saturation level</p>

    <div class="card" style="text-align:center;">
        <div class="slider-val" id="spo2Val">97</div>
        <div style="color:var(--muted); margin-bottom:16px;">% Oxygen Saturation</div>
        <form method="POST">
            {% csrf_token %}
            <input type="range" name="spo2_level" min="70" max="100" value="97"
                oninput="document.getElementById('spo2Val').textContent=this.value; updateColor(this.value);">
            <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:12px;">
                <span>70%</span><span>100%</span>
            </div>
            <div id="spo2Status"
                style="margin-top:16px; padding:12px; border-radius:10px; background:rgba(16,185,129,0.1); color:var(--green); font-weight:600;">
                Normal Range</div>
            <button type="submit" class="btn btn-primary" style="margin-top:24px;">Continue</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    function updateColor(val) {
        let st = document.getElementById('spo2Status');
        if (val >= 95) { st.textContent = 'Normal Range'; st.style.background = 'rgba(16,185,129,0.1)'; st.style.color = '#10b981'; }
        else if (val >= 90) { st.textContent = 'Below Normal'; st.style.background = 'rgba(245,158,11,0.1)'; st.style.color = '#f59e0b'; }
        else { st.textContent = 'Critical — Seek medical help'; st.style.background = 'rgba(239,68,68,0.1)'; st.style.color = '#ef4444'; }
    }
</script>
{% endblock %}
