<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BreathSpiro{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e17;
            --bg2: #111827;
            --card: #1a1f2e;
            --card-hover: #222838;
            --border: #2a3040;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --muted: #64748b;
            --blue: #3b82f6;
            --green: #10b981;
            --purple: #8b5cf6;
            --orange: #f59e0b;
            --red: #ef4444;
            --grad-blue: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Top Navbar */
        .topbar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .topbar-logo .icon {
            width: 36px;
            height: 36px;
            background: var(--grad-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .topbar-logo h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .topbar-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .topbar-nav a {
            color: var(--text2);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .topbar-nav a:hover {
            background: var(--card);
            color: var(--text);
        }

        .topbar-nav a.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--blue);
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-user .avatar {
            width: 32px;
            height: 32px;
            background: var(--grad-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
        }

        .topbar-user span {
            color: var(--text2);
            font-size: 13px;
        }

        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            color: var(--red);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--red);
        }

        /* Page Container */
        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .page-sm {
            max-width: 520px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page-header p {
            color: var(--text2);
            font-size: 14px;
        }

        /* Steps */
        .steps {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
        }

        .step {
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: var(--border);
        }

        .step.done {
            background: var(--green);
        }

        .step.active {
            background: var(--blue);
        }

        /* Card */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 20px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text2);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Option cards */
        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-card {
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-card:hover {
            border-color: var(--blue);
        }

        .option-card.selected {
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .option-card .icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .option-card .name {
            font-size: 14px;
            font-weight: 600;
        }

        .option-card .desc {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Scale items */
        .scale-item {
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
        }

        .scale-item:hover {
            border-color: var(--blue);
        }

        .scale-item.selected {
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .scale-num {
            width: 36px;
            height: 36px;
            background: var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .scale-item.selected .scale-num {
            background: var(--blue);
            color: white;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--grad-blue);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-row .btn {
            flex: 1;
        }

        /* Stats grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat .val {
            font-size: 28px;
            font-weight: 800;
            margin: 8px 0 4px;
        }

        .stat .lbl {
            font-size: 12px;
            color: var(--muted);
        }

        .stat .ico {
            font-size: 24px;
        }

        /* Progress bar */
        .metric {
            margin-bottom: 20px;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .metric-header .name {
            font-weight: 600;
            font-size: 14px;
        }

        .metric-header .val {
            font-weight: 700;
            color: var(--blue);
        }

        .metric-bar {
            height: 10px;
            background: var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 1s ease;
        }

        .fill-blue {
            background: var(--grad-blue);
        }

        .fill-green {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .fill-orange {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .metric-desc {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }

        /* Breathing circle */
        .breath-container {
            text-align: center;
            padding: 40px 0;
        }

        .breath-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 0 auto 24px;
            transition: all 0.5s;
        }

        .breath-circle.inhale {
            transform: scale(1.3);
            border-color: var(--green);
            background: rgba(16, 185, 129, 0.08);
        }

        .breath-circle.hold {
            transform: scale(1.3);
            border-color: var(--orange);
            background: rgba(245, 158, 11, 0.08);
        }

        .breath-circle.exhale {
            transform: scale(1);
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.08);
        }

        .breath-phase {
            font-size: 24px;
            font-weight: 800;
        }

        .breath-timer {
            font-size: 48px;
            font-weight: 800;
            margin-top: 8px;
        }

        .progress-text {
            font-size: 16px;
            color: var(--text2);
            margin-top: 16px;
        }

        /* Session table */
        .session-list {}

        .session-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .session-info .date {
            font-size: 14px;
            font-weight: 600;
        }

        .session-info .meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .session-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
        }

        .badge-orange {
            background: rgba(245, 158, 11, 0.15);
            color: var(--orange);
        }

        /* Slider */
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: var(--border);
            outline: none;
            margin: 16px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--blue);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .slider-val {
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            color: var(--blue);
            margin: 16px 0;
        }

        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--red);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green);
        }

        /* Settings */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .setting-row:last-child {
            border: none;
        }

        .setting-info .title {
            font-weight: 600;
            font-size: 15px;
        }

        .setting-info .desc {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

            {
            % block extra_css %
        }

            {
            % endblock %
        }
    </style>
</head>

<body>
    <div class="topbar">
        <a href="{% url 'web-home' %}" class="topbar-logo">
            <div class="icon">🫁</div>
            <h1>BreathSpiro</h1>
        </a>
        <div class="topbar-nav">
            <a href="{% url 'web-home' %}" class="{% if page == 'home' %}active{% endif %}">🏠 Home</a>
            <a href="{% url 'web-breathing' %}" class="{% if page == 'breathing' %}active{% endif %}">🫁 Training</a>
            <a href="{% url 'web-history' %}" class="{% if page == 'history' %}active{% endif %}">📋 History</a>
            <a href="{% url 'web-user-settings' %}" class="{% if page == 'settings' %}active{% endif %}">⚙️ Settings</a>
        </div>
        <div class="topbar-user">
            <div class="avatar">{{ username|first|upper|default:"?" }}</div>
            <span>{{ username|default:"User" }}</span>
            <a href="{% url 'web-logout' %}" class="btn-logout">Logout</a>
        </div>
    </div>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>

</html>
